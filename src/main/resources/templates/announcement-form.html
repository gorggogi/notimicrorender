<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Announcement | NotifyCommute</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles/styles.css}">
</head>
<body class="bg-gray-100 flex flex-col min-h-screen">

    <!-- Header -->
    <header class="bg-white shadow-md">
        <nav class="container mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="text-2xl font-bold text-gray-800">
                    <a th:href="@{/admin/home}">NotifyCommute Admin</a>
                </div>
                <div class="flex items-center space-x-6">
                    <a th:href="@{/admin/home}" class="text-gray-600 hover:text-blue-600">Home</a>
                    <a th:href="@{/admin/announcement}" class="text-gray-600 hover:text-blue-600">Announcements</a>
                    <a th:href="@{/admin/alert-types}" class="text-gray-600 hover:text-blue-600">Alert Types</a>
                    <a th:href="@{/admin/logs}" class="text-gray-600 hover:text-blue-600">Logs</a>
                    <form th:action="@{/logout}" method="post" class="inline">
                        <button type="submit" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-lg text-sm">
                            Logout
                        </button>
                    </form>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto p-8 flex-grow">
        <div class="w-full max-w-lg mx-auto bg-white p-8 rounded-xl shadow-lg">
            <h1 class="text-2xl font-bold text-gray-800 mb-2">Create Commuter Announcement</h1>
            <p class="text-gray-600 mb-6">Send an SMS alert to subscribed users.</p>

            <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-lg relative mb-4" role="alert">
                <p th:text="${success}"></p>
            </div>
            <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg relative mb-4" role="alert">
                <p th:text="${error}"></p>
            </div>

            <form th:action="@{/admin/announcement}" method="post">
                <div class="mb-5">
                    <label for="alertId" class="block mb-2 text-sm font-medium">Alert Type</label>
                    <select id="alertId" name="alertId" class="bg-gray-50 border border-gray-300 text-sm rounded-lg block w-full p-2.5" required>
                        <option value="">-- Select an Alert Type --</option>
                        <option th:each="alert : ${alertTypes}" th:value="${alert.alertId}" th:text="${alert.alertName}"></option>
                    </select>
                </div>
                <div class="mb-6">
                    <label for="message" class="block mb-2 text-sm font-medium">Message Content</label>
                    <textarea id="message" name="message" rows="4" class="block p-2.5 w-full text-sm rounded-lg border border-gray-300" placeholder="e.g., LRT-1 service is temporarily suspended..." required></textarea>
                </div>
                <button type="submit" class="text-white bg-blue-600 hover:bg-blue-700 font-medium rounded-lg text-sm w-full px-5 py-2.5 text-center">
                    Send Announcement
                </button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-200 text-center text-sm py-4 mt-auto">
        <div class="container mx-auto">
            &copy; <span th:text="${#dates.year(#dates.createNow())}">2025</span> Notification Microservice. All Rights Reserved.
        </div>
    </footer>

    <script th:src="@{/scripts/scripts.js}"></script>
</body>
</html>
