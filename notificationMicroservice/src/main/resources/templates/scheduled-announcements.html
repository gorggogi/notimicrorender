<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Scheduled Announcements | NotifyCommute</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles/styles.css}">
</head>
<body class="bg-gray-100 flex flex-col min-h-screen">

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container mx-auto p-8 flex-grow">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">Scheduled Announcements</h1>

        <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-lg relative mb-4">
            <p th:text="${success}"></p>
        </div>
        <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg relative mb-4">
            <p th:text="${error}"></p>
        </div>

        <div class="bg-yellow-100 border-l-4 border-yellow-500 text-yellow-700 p-4 rounded-lg mb-6" role="alert">
            <p class="font-bold">Please Note</p>
            <p>Announcements cannot be edited or deleted within <strong th:text="${lockoutPeriodMillis / 60000} + ' minutes'">15 minutes</strong> of their scheduled time to ensure proper system processing.</p>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-lg">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Upcoming Announcements</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full text-sm text-left">
                    <thead class="text-xs uppercase bg-gray-50">
                    <tr>
                        <th class="px-6 py-3">Scheduled For</th>
                        <th class="px-6 py-3">Message</th>
                        <th class="px-6 py-3">Sent By</th>
                        <th class="px-6 py-3">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="notification : ${scheduledNotifications}" class="bg-white border-b">
                        <td class="px-6 py-4" th:text="${#dates.format(notification.scheduleTime, 'yyyy-MM-dd HH:mm')}"></td>
                        <td class="px-6 py-4" th:text="${notification.message}"></td>
                        <td class="px-6 py-4" th:text="${notification.sentBy}"></td>
                        <td class="px-6 py-4 flex items-center space-x-4">
                            <th:block th:with="isLocked=${(notification.scheduleTime.getTime() - #dates.createNow().getTime()) < lockoutPeriodMillis}">
                                <a th:if="${not isLocked}"
                                   th:href="@{/admin/edit-scheduled/{id}(id=${notification.id})}"
                                   class="font-medium text-blue-600 hover:underline">Edit</a>
                                <span th:if="${isLocked}"
                                      class="text-gray-400 cursor-not-allowed">Edit</span>

                                <form th:action="@{/admin/delete-scheduled/{id}(id=${notification.id})}" method="post" onsubmit="return confirm('Are you sure you want to delete this scheduled announcement?');">
                                    <button type="submit"
                                            th:disabled="${isLocked}"
                                            th:class="${isLocked ? 'text-gray-400 cursor-not-allowed' : 'font-medium text-red-600 hover:underline'}">Delete</button>
                                </form>
                            </th:block>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(scheduledNotifications)}">
                        <td colspan="4" class="px-6 py-4 text-center text-gray-500">No scheduled announcements found.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script th:src="@{/scripts/scripts.js}"></script>
</body>
</html>
