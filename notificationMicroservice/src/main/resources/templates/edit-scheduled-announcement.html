<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Scheduled Announcement | NotifyCommute</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles/styles.css}">
</head>
<body class="bg-gray-100 flex flex-col min-h-screen">

      <div th:replace="~{fragments/header :: header}"></div>

    <main class="container mx-auto p-8 flex-grow">
        <div class="w-full max-w-lg mx-auto bg-white p-8 rounded-xl shadow-lg">
            <h1 class="text-2xl font-bold text-gray-800 mb-6">Edit Scheduled Announcement</h1>
            
            <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg relative mb-4" role="alert">
                <p th:text="${error}"></p>
            </div>

            <form th:action="@{/admin/edit-scheduled/{id}(id=${scheduledNotification.id})}" th:object="${scheduledNotification}" method="post">
                <div class="mb-5">
                    <label for="alertId" class="block mb-2 text-sm font-medium">Alert Type</label>
                    <select id="alertId" name="alertId" class="bg-gray-50 border border-gray-300 text-sm rounded-lg block w-full p-2.5" required>
                        <option th:each="alert : ${alertTypes}"
                                th:value="${alert.alertId}"
                                th:text="${alert.alertName}"
                                th:selected="${alert.alertId == scheduledNotification.alertId}"></option>
                    </select>
                </div>
                <div class="mb-6">
                    <label for="message" class="block mb-2 text-sm font-medium">Message Content</label>
                    <textarea id="message" name="message" rows="4" class="block p-2.5 w-full text-sm rounded-lg border border-gray-300" th:field="*{message}" required></textarea>
                </div>
                <div class="mb-6">
                    <label for="scheduleTime" class="block mb-2 text-sm font-medium">Schedule Time</label>
                    <input type="datetime-local" id="scheduleTime" name="scheduleTime" class="bg-gray-50 border border-gray-300 text-sm rounded-lg block w-full p-2.5"
                           th:value="${#dates.format(scheduledNotification.scheduleTime, 'yyyy-MM-dd''T''HH:mm')}" required>
                </div>
                <button type="submit" class="text-white bg-blue-600 hover:bg-blue-700 font-medium rounded-lg text-sm w-full px-5 py-2.5 text-center">
                    Save Changes
                </button>
                 <a th:href="@{/admin/scheduled-announcements}" class="block text-center mt-4 text-sm text-gray-600 hover:text-blue-600">Cancel</a>
            </form>
        </div>
    </main>

    <footer class="bg-gray-200 text-center text-sm py-4 mt-auto">
        <div class="container mx-auto">
            &copy; <span th:text="${#dates.year(#dates.createNow())}">2025</span> Notification Microservice. All Rights Reserved.
        </div>
    </footer>

</body>
</html>
