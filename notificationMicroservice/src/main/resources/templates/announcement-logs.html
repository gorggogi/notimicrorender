<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Announcement Logs | NotifyCommute</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles/styles.css}">
</head>
<body class="bg-gray-100 flex flex-col min-h-screen">

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container mx-auto p-8 flex-grow">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">Announcement Master Log</h1>

        <div class="bg-white p-6 rounded-xl shadow-lg">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Created Announcements</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full text-sm text-left">
                    <thead class="text-xs uppercase bg-gray-50">
                    <tr>
                        <th class="px-6 py-3">Timestamp</th>
                        <th class="px-6 py-3">Message Content</th>
                        <th class="px-6 py-3">Alert Type</th>
                        <th class="px-6 py-3">Sent By</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="announcement : ${announcements}" class="bg-white border-b">
                        <td class="px-6 py-4" th:text="${#dates.format(announcement.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
                        <td class="px-6 py-4" th:text="${announcement.messageContent}"></td>
                        <td class="px-6 py-4" th:text="${announcement.alertType.alertName}"></td>
                        <td class="px-6 py-4" th:text="${announcement.sentBy}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(announcements)}">
                        <td colspan="4" class="px-6 py-4 text-center text-gray-500">No announcements have been created yet.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
