<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Direct Message | NotifyCommute</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles/styles.css}">
</head>
<body class="bg-gray-100 flex flex-col min-h-screen">

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container mx-auto p-8 flex-grow">
        <div class="w-full max-w-lg mx-auto bg-white p-8 rounded-xl shadow-lg">
            <h1 class="text-2xl font-bold text-gray-800 mb-2">Send Direct SMS</h1>
            <p class="text-gray-600 mb-6">Send a one-time SMS to a specific phone number.</p>

            <!-- This div will be used by JavaScript to display success or error messages -->
            <div id="form-status-message" class="mb-4"></div>

            <form id="directMessageForm">
                <div class="mb-5">
                    <label for="phoneNumber" class="block mb-2 text-sm font-medium">Phone Number</label>
                    <input type="text" id="phoneNumber" name="phoneNumber" class="bg-gray-50 border border-gray-300 text-sm rounded-lg block w-full p-2.5" placeholder="e.g., 09171234567" required>
                </div>
                <div class="mb-6">
                    <label for="message" class="block mb-2 text-sm font-medium">Message Content</label>
                    <textarea id="message" name="message" rows="4" class="block p-2.5 w-full text-sm rounded-lg border border-gray-300" placeholder="Enter your message here..." required></textarea>
                </div>
                <button type="submit" class="text-white bg-blue-600 hover:bg-blue-700 font-medium rounded-lg text-sm w-full px-5 py-2.5 text-center">
                    Send Message
                </button>
            </form>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('directMessageForm');
            const statusMessageDiv = document.getElementById('form-status-message');
            const submitButton = form.querySelector('button[type="submit"]');

            form.addEventListener('submit', async function (e) {
                e.preventDefault();

                // Disable button
                submitButton.disabled = true;
                submitButton.textContent = 'Sending...';

                const phoneNumber = document.getElementById('phoneNumber').value;
                const message = document.getElementById('message').value;
                const token = localStorage.getItem('jwtToken'); // Assumes JWT is stored in localStorage

                statusMessageDiv.innerHTML = ''; // Clear previous messages

                if (!token) {
                    displayMessage('Authentication error: Not logged in.', 'error');
                    enableButton();
                    return;
                }

                try {
                    const response = await fetch('/api/v1/send/direct', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ phoneNumber, message })
                    });

                    if (response.ok) {
                        const responseText = await response.text();
                        displayMessage(responseText, 'success');
                        form.reset(); // Clear the form on success
                    } else {
                        const errorText = await response.text();
                        displayMessage(`Error: ${errorText}`, 'error');
                    }
                } catch (error) {
                    displayMessage('A network error occurred. Please try again.', 'error');
                }

                enableButton();
            });

            function displayMessage(message, type) {
                const colorClasses = type === 'success' 
                    ? 'bg-green-100 border border-green-400 text-green-700'
                    : 'bg-red-100 border border-red-400 text-red-700';
                statusMessageDiv.innerHTML = `<div class="${colorClasses} px-4 py-3 rounded-lg relative" role="alert"><p>${message}</p></div>`;
            }

            function enableButton() {
                submitButton.disabled = false;
                submitButton.textContent = 'Send Message';
            }
        });
    </script>
</body>
</html>
