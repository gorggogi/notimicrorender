<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Key Management | Philippine Komyut</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container mx-auto p-8 flex-grow">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">API Key Management</h1>
        <p class="text-gray-600 mb-8">Generate and manage API keys for client applications.</p>

        <!-- Success Message -->
        <div th:if="${success}" class="bg-green-100 border-l-4 border-green-500 text-green-700 p-4 rounded-lg mb-6 shadow-md">
            <p class="font-bold" th:text="${success}"></p>
            <div th:if="${generatedKey}" class="mt-4 p-4 bg-gray-800 text-white rounded-lg font-mono">
                <p><strong class="text-green-400">Client:</strong> <span th:text="${clientName}"></span></p>
                <p class="mt-2"><strong class="text-green-400">API Key:</strong> <code th:text="${generatedKey}" class="break-all"></code></p>
                <p class="mt-4 text-sm text-yellow-400">Please copy this key now. You will not be able to see it again.</p>
            </div>
        </div>

        <!-- Error Message -->
        <div th:if="${error}" class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 rounded-lg mb-6 shadow-md">
            <p class="font-bold" th:text="${error}"></p>
        </div>

        <!-- Form Container -->
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-lg mx-auto">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Generate New API Key</h2>
            <form th:action="@{/admin/api-keys/generate}" method="post" class="space-y-6">
                <div>
                    <label for="clientName" class="block text-sm font-medium text-gray-700">Client Name</label>
                    <input type="text" id="clientName" name="clientName" required 
                           class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
                <button type="submit" 
                        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                    Generate Key
                </button>
            </form>
        </div>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
