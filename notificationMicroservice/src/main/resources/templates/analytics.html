<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics | NotifyCommute</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles/styles.css}">
</head>
<body class="bg-gray-100 flex flex-col min-h-screen">

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container mx-auto p-8 flex-grow">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">Notification Analytics</h1>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-lg">
                <h3 class="text-sm font-medium text-gray-500">Total Announcements</h3>
                <p class="text-3xl font-bold text-gray-900" th:text="${totalAnnouncements}">0</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-lg">
                <h3 class="text-sm font-medium text-gray-500">Total Recipients</h3>
                <p class="text-3xl font-bold text-gray-900" th:text="${totalSent}">0</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-lg">
                <h3 class="text-sm font-medium text-gray-500">Successful Deliveries</h3>
                <p class="text-3xl font-bold text-green-600" th:text="${successful}">0</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-lg">
                <h3 class="text-sm font-medium text-gray-500">Success Rate</h3>
                <p class="text-3xl font-bold text-blue-600" th:text="${successRate} + '%'">0.00%</p>
            </div>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-lg">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Event Logs</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full text-sm text-left">
                    <thead class="text-xs uppercase bg-gray-50">
                    <tr>
                        <th class="px-6 py-3">Timestamp</th>
                        <th class="px-6 py-3">Message</th>
                        <th class="px-6 py-3">Sent By</th>
                        <th class="px-6 py-3">Status</th>
                        <th class="px-6 py-3">Recipient</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="log : ${logs}" class="bg-white border-b">
                        <td class="px-6 py-4" th:text="${#dates.format(log.timestamp, 'yyyy-MM-dd HH:mm:ss')}"></td>
                        <td class="px-6 py-4" th:text="${log.notification.messageContent}"></td>
                        <td class="px-6 py-4" th:text="${log.notification.sentBy}"></td>
                        <td class="px-6 py-4">
                            <span th:text="${log.status}"
                                  th:classappend="${log.status == 'CREATED' ? 'text-blue-600' : (log.status == 'SENT_TO_GATEWAY' ? 'text-green-600' : 'text-red-600')}"></span>
                        </td>
                        <td class="px-6 py-4" th:text="${log.sentTo != null ? log.sentTo : 'N/A'}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(logs)}">
                        <td colspan="5" class="px-6 py-4 text-center text-gray-500">No logs found.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script th:src="@{/scripts/scripts.js}"></script>
</body>
</html>
