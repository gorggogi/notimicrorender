# Give your application a name
spring.application.name=notificationMicroservice

# ===============================================
# DATABASE CONFIGURATION (MySQL)
# ===============================================

# The JDBC URL for your MySQL database.
# Replace 'notification_db' if you named your database something different.
spring.datasource.url=jdbc:mysql://localhost:3306/notification_db

# Your MySQL database username. 'root' is common for local development.
spring.datasource.username=root

# !!! IMPORTANT !!! Replace with your actual MySQL password.
spring.datasource.password=

# The driver class for MySQL Connector/J 8+.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================================
# JPA & HIBERNATE CONFIGURATION
# ===============================================

# Hibernate's dialect for MySQL 8.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# This is a critical setting for development.
# 'update' tells Hibernate to automatically create or update the database tables
# based on your @Entity classes (like User, AlertType, etc.) when the application starts.
# Other options: 'create' (drops and recreates every time), 'validate', 'none' (for production).
spring.jpa.hibernate.ddl-auto=update

# This is very useful for debugging. It prints the actual SQL queries
# generated by Hibernate to the console.
spring.jpa.show-sql=true

# Formats the SQL printed to the console to be more readable.
spring.jpa.properties.hibernate.format_sql=true

