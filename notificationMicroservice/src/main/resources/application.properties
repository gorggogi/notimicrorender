
# Server port
server.port=8081

# Give your application a name
spring.application.name=notificationMicroservice

# ===============================================
# DATABASE CONFIGURATION (MySQL)
# ===============================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ===============================================
# JPA & HIBERNATE CONFIGURATION
# ===============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================================
# PhilSMS API Configuration
# ===============================================
philsms.api.token=${PHILSMS_API_TOKEN} 
philsms.sender.id=${PHILSMS_SENDER_ID}

# ===============================================
# SESSION CONFIGURATION - Fix login timeout issues
# ===============================================
server.servlet.session.timeout=2h
server.servlet.session.cookie.max-age=7200
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.persistent=true

# ===============================================
# LOGGING CONFIGURATION
# ===============================================
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.web.authentication=DEBUG